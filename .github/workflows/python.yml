name: Python package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run CLI smoke test
        run: |
          rpf validate examples/weather-input-0.2.json --compact
          rpf validate examples/coincidence-interpretation-input-0.2.json --compact
          rpf validate examples/reflected-desire-input-0.2.json --compact
          rpf validate examples/source-echo-input-0.2.json --compact
          rpf validate examples/wave-tank-no-reference-input-0.2.json --compact
          rpf validate examples/loop-collapse-self-input-0.2.json --compact
          rpf validate examples/loop-collapse-external-input-0.2.json --compact
